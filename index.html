<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts/p5.min.js"></script>

<body>
    <div class="container">
        <p>Settings</p>
        <div class="input-field">
            <div class="input-head">
                <label for="range-input">./ sides</label>
                <output for="range-input" id="range-output"></output>
            </div>
            <input type="range" class="range" id="range-input" min="3" max="20" step="1" value="8">
        </div>
        <p>Controls</p>
        <div class="input-head">
            <label for="">./ Exciter Velocity + Speed</label>
            <output for="">Left Mouse Drag</output>
        </div>
        <div class="input-head">
            <label for="">./ Resonator Sidecount</label>
            <output for="">Mousewheel on input</output>
        </div>
        <div class="input-head">
            <label for="">./ Exciter Speed</label>
            <output for="">Mousewheel on bounce</output>
        </div>
        <div class="input-head">
            <label for="">./ Reset</label>
            <output for="">Right Mouse Button</output>
        </div>
    </div>
    <main></main>
